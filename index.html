<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SURI VOGUE</title>
<style>
:root{
  --bg:#fafafa;--card:#fff;--text:#1a1a1a;--sub:#888;--border:#eee;
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}

.header{position:sticky;top:0;z-index:100;background:var(--bg);padding:calc(var(--safe-t) + 14px) 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.logo{font-size:1rem;font-weight:700;letter-spacing:.1em}
.count{font-size:.75rem;color:var(--sub)}

.waterfall{padding:6px;columns:2;column-gap:6px}
.card{break-inside:avoid;margin-bottom:6px;border-radius:8px;overflow:hidden;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card img{width:100%;display:block}

.viewer{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.viewer.open{opacity:1;pointer-events:all}
.viewer-close{position:absolute;top:calc(var(--safe-t) + 12px);right:16px;background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;z-index:10}
.viewer-counter{position:absolute;top:calc(var(--safe-t) + 16px);left:16px;color:rgba(255,255,255,.6);font-size:.72rem}
.viewer img{max-width:92%;max-height:80vh;object-fit:contain;border-radius:6px}
.viewer-hint{position:absolute;bottom:calc(var(--safe-b) + 20px);color:rgba(255,255,255,.4);font-size:.7rem}
</style>
</head>
<body>
<div class="header">
  <div class="logo">SURI VOGUE</div>
  <div class="count" id="count"></div>
</div>
<div class="waterfall" id="waterfall"></div>
<div class="viewer" id="viewer">
  <button class="viewer-close" id="vClose">✕</button>
  <span class="viewer-counter" id="vCounter"></span>
  <img id="vImg" alt="">
  <span class="viewer-hint">← 滑动翻看 →</span>
</div>
<script>
const FILES=["001.jpg","002.jpg","003.jpg","004.jpg","005.jpg","006.jpg","007.jpg","009.jpg","010.jpg","011.jpg","012.png","013.jpg","014.jpg","015.jpg","016.jpg","017.png","018.jpg","019.jpg","020.jpg","021.jpg","022.jpg","024.jpg","025.jpg","026.jpg","027.jpg","028.jpg","029.jpg","030.jpg","031.jpg","032.jpg","033.jpg","034.png","035.jpg","036.png","037.jpg","038.jpg","039.jpg","040.jpg","041.png","042.jpg","043.jpg","044.png","045.jpg","046.jpg","047.jpg","048.jpg","049.jpg","050.jpg","051.jpg","052.jpg","053.jpg","054.jpg","055.jpg","056.jpg","057.jpg","058.jpg","059.jpg","060.jpg","061.jpg","062.png","063.jpg"];

// Shuffle on every open
for(let i=FILES.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[FILES[i],FILES[j]]=[FILES[j],FILES[i]]}

document.getElementById('count').textContent=FILES.length+' 件';
document.getElementById('waterfall').innerHTML=FILES.map((f,i)=>`<div class="card" data-idx="${i}"><img src="closet/${f}" alt="" loading="lazy"></div>`).join('');

// Viewer
let vIdx=0;
function showSlide(){document.getElementById('vImg').src='closet/'+FILES[vIdx];document.getElementById('vCounter').textContent=(vIdx+1)+'/'+FILES.length}
document.getElementById('waterfall').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;vIdx=+c.dataset.idx;showSlide();document.getElementById('viewer').classList.add('open')});
document.getElementById('vClose').addEventListener('click',()=>document.getElementById('viewer').classList.remove('open'));
let sx=0;
document.getElementById('viewer').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
document.getElementById('viewer').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)<40){document.getElementById('viewer').classList.remove('open');return}if(dx<-40&&vIdx<FILES.length-1){vIdx++;showSlide()}else if(dx>40&&vIdx>0){vIdx--;showSlide()}});
</script>
</body>
</html>
