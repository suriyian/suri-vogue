<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SURI VOGUE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--card:#151515;--text:#f5f5f3;--sub:#888;--accent:#c9a96e;
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);
  --font:'Cormorant Garamond',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent}

/* App shell */
.app{height:100%;display:flex;flex-direction:column;padding-top:var(--safe-t)}

/* Header */
.header{padding:16px 20px 12px;display:flex;align-items:baseline;justify-content:space-between;flex-shrink:0}
.logo{font-size:1.1rem;font-weight:300;letter-spacing:.25em;color:var(--text)}
.count{font-size:.75rem;color:var(--sub);letter-spacing:.05em}

/* Grid */
.grid-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px 120px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.grid-item{aspect-ratio:3/4;overflow:hidden;border-radius:4px;cursor:pointer;position:relative;background:var(--card)}
.grid-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.grid-item:active img{transform:scale(.97)}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;padding:40px}
.empty-icon{font-size:3rem;opacity:.3}
.empty-text{font-size:.85rem;color:var(--sub);text-align:center;line-height:1.6;letter-spacing:.03em}

/* FAB */
.fab{position:fixed;bottom:calc(28px + var(--safe-b));right:20px;width:52px;height:52px;border-radius:50%;
  background:var(--accent);border:none;color:var(--bg);font-size:1.6rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(201,169,110,.4);
  transition:transform .15s;z-index:100}
.fab:active{transform:scale(.9)}
input[type=file]{display:none}

/* Viewer */
.viewer{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .25s}
.viewer.open{opacity:1;pointer-events:all}
.viewer-top{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--safe-t) + 12px) 20px 12px;flex-shrink:0}
.viewer-close{background:none;border:none;color:var(--text);font-size:1.3rem;cursor:pointer;padding:8px}
.viewer-counter{font-size:.72rem;color:var(--sub);letter-spacing:.12em}
.viewer-del{background:none;border:none;color:#e74c3c;font-size:.78rem;cursor:pointer;padding:8px;letter-spacing:.05em}
.viewer-body{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-x}
.viewer-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.viewer-bottom{padding:12px 20px calc(var(--safe-b) + 16px);text-align:center;flex-shrink:0}
.viewer-hint{font-size:.7rem;color:var(--sub);letter-spacing:.08em}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">SURI VOGUE</div>
    <div class="count" id="count"></div>
  </header>
  <div class="grid-wrap" id="gridWrap">
    <div class="empty" id="empty">
      <div class="empty-icon">👗</div>
      <div class="empty-text">你的衣柜还是空的<br>点右下角 + 开始上传</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <button class="fab" id="fab">+</button>
  <input type="file" id="fileInput" accept="image/*" multiple>
</div>

<!-- Fullscreen viewer -->
<div class="viewer" id="viewer">
  <div class="viewer-top">
    <button class="viewer-close" id="vClose">✕</button>
    <span class="viewer-counter" id="vCounter"></span>
    <button class="viewer-del" id="vDel">删除</button>
  </div>
  <div class="viewer-body" id="vBody">
    <img class="viewer-img" id="vImg" alt="">
  </div>
  <div class="viewer-bottom">
    <span class="viewer-hint">← 滑动翻看 →</span>
  </div>
</div>

<script>
const KEY='sv_items';const IMG_P='sv_i_';
let items=JSON.parse(localStorage.getItem(KEY)||'[]');

// Compress image
function compress(dataUrl,maxW=500){
  return new Promise(r=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>maxW){h=h*maxW/w;w=maxW}
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      r(c.toDataURL('image/jpeg',.55));
    };img.src=dataUrl;
  });
}
function readFile(f){return new Promise(r=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.readAsDataURL(f)})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

// Save / load
function save(){localStorage.setItem(KEY,JSON.stringify(items))}
function getImg(id){return localStorage.getItem(IMG_P+id)||''}
function setImg(id,data){try{localStorage.setItem(IMG_P+id,data)}catch(e){alert('存储空间已满，请删除一些照片')}}
function delImg(id){localStorage.removeItem(IMG_P+id)}

// Render
function render(){
  const grid=document.getElementById('grid');
  const empty=document.getElementById('empty');
  document.getElementById('count').textContent=items.length?items.length+' 件':'';
  if(!items.length){empty.style.display='flex';grid.innerHTML='';return}
  empty.style.display='none';
  grid.innerHTML=items.map((it,i)=>`<div class="grid-item" data-idx="${i}"><img src="${getImg(it.id)}" alt="" loading="lazy"></div>`).join('');
}

// Upload
document.getElementById('fab').addEventListener('click',()=>document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change',async e=>{
  const files=Array.from(e.target.files);if(!files.length)return;
  for(const f of files){
    const raw=await readFile(f);
    const compressed=await compress(raw);
    const id=uid();
    setImg(id,compressed);
    items.push({id,ts:Date.now()});
  }
  save();render();e.target.value='';
});

// Viewer
let vIdx=0;
function openViewer(idx){
  vIdx=idx;showSlide();document.getElementById('viewer').classList.add('open');
}
function closeViewer(){document.getElementById('viewer').classList.remove('open')}
function showSlide(){
  if(!items.length){closeViewer();return}
  if(vIdx<0)vIdx=0;if(vIdx>=items.length)vIdx=items.length-1;
  document.getElementById('vImg').src=getImg(items[vIdx].id);
  document.getElementById('vCounter').textContent=`${vIdx+1} / ${items.length}`;
}

document.getElementById('grid').addEventListener('click',e=>{
  const item=e.target.closest('.grid-item');if(!item)return;
  openViewer(parseInt(item.dataset.idx));
});
document.getElementById('vClose').addEventListener('click',closeViewer);
document.getElementById('vDel').addEventListener('click',()=>{
  if(!confirm('删除这件？'))return;
  const it=items[vIdx];delImg(it.id);items.splice(vIdx,1);save();
  if(!items.length){closeViewer();render();return}
  if(vIdx>=items.length)vIdx=items.length-1;showSlide();render();
});

// Swipe
let sx=0;
document.getElementById('vBody').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
document.getElementById('vBody').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx<-40&&vIdx<items.length-1){vIdx++;showSlide()}
  else if(dx>40&&vIdx>0){vIdx--;showSlide()}
});

render();
</script>
</body>
</html>
